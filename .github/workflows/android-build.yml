name: Android CI

on:
  push:
    branches: [main, full-app-implementation, fix/background-voice-orb-and-commands]
  pull_request:
    branches: [main, misha-final-implementation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Smoke test public Vercel backend
        run: |
          curl --fail --silent --show-error https://misha-search-backend.vercel.app/api/health
          curl --fail --silent --show-error "https://misha-search-backend.vercel.app/api/search?q=Android%20security"

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: misha-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
